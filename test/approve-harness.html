<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>결재 흐름 점검 · but (개발용)</title>
<style>
  html,body{margin:0;height:100%;background:#eee}
  #bar{font:12px/1.55 system-ui,-apple-system,sans-serif;padding:6px 10px;background:#fff;border-bottom:1px solid #ddd}
  #bar b{color:#642128}
  #log{margin:4px 0 0;font:11px/1.45 ui-monospace,Menlo,monospace;color:#333;white-space:pre-wrap;max-height:96px;overflow:auto}
  #h{width:100%;height:calc(100vh - 78px);border:0;display:block;background:#fff}
</style>
</head>
<body>
<div id="bar">
  <b>개발용 점검 화면</b> · 배포된 index.html / app.js / style.css 를 그대로 불러오고, 카드뉴스 목록·본문과 GitHub API 응답만 모의로 바꿔 결재 흐름을 확인합니다. 실제 저장소에는 아무것도 쓰지 않습니다.
  <pre id="log">아직 요청 없음</pre>
</div>
<iframe id="h" title="결재 흐름 점검"></iframe>
<script>
(function () {
  var base = location.origin + location.pathname.replace(/test\/[^/]*$/, '');
  var stub = [
    '<script>(function(){',
    'var realFetch = window.fetch.bind(window);',
    'window.__calls = [];',
    'var MAN = {site:"harness",repo:"konghwanhee/but",generatedAt:"2026-11-17T21:00:00+09:00",decks:[',
    '{id:"beauty-point-01",series:"point",seriesLabel:"뷰티 포인트",issueNo:1,date:"2026-11-16",title:"포인트 호 (결재 숨김 확인)",subtitle:"scope check",coverThumb:"covers/beauty-point-01-cover.png",jsonPath:"data/beauty-point-01.json",updatedAt:"2026-11-17T20:25:18+09:00"},',
    '{id:"test-briefing-01",series:"briefing",seriesLabel:"데일리 브리핑",issueNo:1,date:"2026-11-17",title:"테스트 브리핑 호",subtitle:"결재 흐름 확인용 모의 데이터",coverThumb:"covers/beauty-point-01-cover.png",jsonPath:"data/test-briefing-01.json",updatedAt:"2026-11-17T21:00:00+09:00"}',
    ']};',
    'var deckP = null;',
    'function getDeck(){ if(!deckP) deckP = realFetch("data/beauty-point-01.json",{cache:"no-store"}).then(function(r){return r.json();}); return deckP; }',
    'function b64(s){ return btoa(unescape(encodeURIComponent(s))); }',
    'function jsonRes(o){ return Promise.resolve(new Response(JSON.stringify(o),{status:200,headers:{"Content-Type":"application/json"}})); }',
    'window.fetch = function(url, opts){',
    '  url = String(url && url.url ? url.url : url); opts = opts || {};',
    '  var method = String(opts.method || "GET").toUpperCase();',
    '  if (url.indexOf("api.github.com/user") >= 0) return jsonRes({login:"konghwanhee"});',
    '  if (url.indexOf("api.github.com/repos/konghwanhee/but") >= 0 && url.indexOf(".json") < 0) return jsonRes({permissions:{push:true}});',
    '  if (url.indexOf(".json") >= 0) {',
    '    var isMan = url.indexOf("manifest.json") >= 0;',
    '    if (method === "GET") {',
    '      if (isMan) return getDeck().then(function(){ return jsonRes({content:b64(JSON.stringify(MAN)),sha:"sha_manifest"}); });',
    '      return getDeck().then(function(d){ return jsonRes({content:b64(JSON.stringify(d)),sha:"sha_deck"}); });',
    '    }',
    '    window.__calls.push({target:(isMan?"manifest":"deck"),method:method,body:JSON.parse(opts.body)});',
    '    if (isMan) { try { MAN = JSON.parse(decodeURIComponent(escape(atob(JSON.parse(opts.body).content)))); } catch(e) {} }',
    '    return jsonRes({commit:{sha:(isMan?"c0ffee1":"deadbee")}});',
    '  }',
    '  return realFetch(url, opts);',
    '};',
    '})();<\/script>'
  ].join('\n');

  fetch(base + 'index.html', { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var patched = html
        .replace('<head>', '<head>\n<base href="' + base + '">')
        .replace('<script src="app.js', stub + '\n<script src="app.js');
      document.getElementById('h').srcdoc = patched;
    })
    .catch(function (e) {
      document.getElementById('log').textContent = 'index.html 을 읽지 못했습니다 · ' + e.message;
    });

  var log = document.getElementById('log');
  setInterval(function () {
    var w = document.getElementById('h').contentWindow;
    var calls = (w && w.__calls) || [];
    if (!calls.length) return;
    log.textContent = calls.map(function (c) {
      var b = c.body || {};
      var fields = '';
      if (c.target === 'deck') {
        fields = 'approved=' + b.approved + ' · approvedAt=' + b.approvedAt + ' · scheduledUploadAt=' + b.scheduledUploadAt + ' · publishedAt=' + b.publishedAt;
      } else {
        var d = (b.content ? JSON.parse(decodeURIComponent(escape(atob(b.content)))) : {}).decks || [];
        var t = d.filter(function (x) { return x.id === 'test-briefing-01'; })[0] || {};
        fields = 'manifest → approved=' + t.approved + ' · scheduledUploadAt=' + t.scheduledUploadAt + ' · publishedAt=' + t.publishedAt;
      }
      return c.method + ' ' + c.target + ' · ' + fields + ' · msg="' + b.message + '"';
    }).join('\n');
  }, 400);
})();
</script>
</body>
</html>
